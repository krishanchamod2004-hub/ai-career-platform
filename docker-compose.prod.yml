# =============================================================================
# Production Docker Compose - VPS Deployment (Pull Images Only)
# =============================================================================
# This compose file is designed for VPS deployment where images are pre-built
# and pushed to a container registry. The VPS only pulls and runs containers.
#
# Prerequisites:
#   1. Images must be built locally and pushed to registry
#   2. .env file must exist with all required variables
#   3. Nginx reverse proxy should be configured separately
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

version: '3.9'

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-career:
    driver: bridge
    name: ai-career-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: ai-career-postgres-data
  redis_data:
    name: ai-career-redis-data

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai-career-postgres
    restart: unless-stopped
    networks:
      - ai-career
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_platform}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_career_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No port exposure - internal only

  # ---------------------------------------------------------------------------
  # Redis 7 - Cache & Queue Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-career-redis
    restart: unless-stopped
    networks:
      - ai-career
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No port exposure - internal only

  # ---------------------------------------------------------------------------
  # JobSpy - Python Scraper Microservice
  # ---------------------------------------------------------------------------
  # IMPORTANT: Replace "your-registry" with your actual registry
  # Examples:
  #   - Docker Hub: username/ai-career-jobspy:latest
  #   - GHCR: ghcr.io/username/ai-career-jobspy:latest
  #   - Private: registry.example.com/ai-career-jobspy:latest
  # ---------------------------------------------------------------------------
  jobspy:
    image: ${DOCKER_REGISTRY:-your-registry}/ai-career-jobspy:${IMAGE_TAG:-latest}
    container_name: ai-career-jobspy
    restart: unless-stopped
    networks:
      - ai-career
    environment:
      JOBSPY_HOST: 0.0.0.0
      JOBSPY_PORT: 8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN:?JOBSPY_API_TOKEN is required}
      JOBSPY_ALLOW_INSECURE: ${JOBSPY_ALLOW_INSECURE:-false}
      JOBSPY_PROXIES: ${JOBSPY_PROXIES:-}
      JOBSPY_DEFAULT_RESULTS_WANTED: ${JOBSPY_DEFAULT_RESULTS_WANTED:-25}
      JOBSPY_MAX_RESULTS_WANTED: ${JOBSPY_MAX_RESULTS_WANTED:-100}
      JOBSPY_MAX_CONCURRENCY: ${JOBSPY_MAX_CONCURRENCY:-2}
      JOBSPY_REQUEST_TIMEOUT_SECONDS: ${JOBSPY_REQUEST_TIMEOUT_SECONDS:-180}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    # No port exposure - internal only

  # ---------------------------------------------------------------------------
  # API - NestJS Backend
  # ---------------------------------------------------------------------------
  api:
    image: ${DOCKER_REGISTRY:-your-registry}/ai-career-api:${IMAGE_TAG:-latest}
    container_name: ai-career-api
    restart: unless-stopped
    networks:
      - ai-career
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobspy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_career_platform}?schema=public&pool_timeout=60&connection_limit=20
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Authentication
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      
      # URLs
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      
      # Queue
      QUEUE_PREFIX: ${QUEUE_PREFIX:-aicareer}
      RUN_WORKERS_IN_API: "false"
      ENABLE_SCHEDULER: "false"
      
      # JobSpy
      JOBSPY_SERVICE_URL: http://jobspy:8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN}
      JOBSPY_TIMEOUT_MS: ${JOBSPY_TIMEOUT_MS:-200000}
      
      # Worker Settings
      SCRAPER_MAX_CONSECUTIVE_FAILURES: ${SCRAPER_MAX_CONSECUTIVE_FAILURES:-10}
      JOB_STALE_DAYS: ${JOB_STALE_DAYS:-14}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      
      # AI
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      
      # Billing
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      LEMON_SQUEEZY_VARIANT_ID_PRO: ${LEMON_SQUEEZY_VARIANT_ID_PRO:-}
      LEMON_SQUEEZY_VARIANT_ID_PREMIUM: ${LEMON_SQUEEZY_VARIANT_ID_PREMIUM:-}
    expose:
      - "4000"
    # If you need direct access for debugging, uncomment:
    # ports:
    #   - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "com.ai-career.service=api"
      - "com.ai-career.version=${IMAGE_TAG:-latest}"

  # ---------------------------------------------------------------------------
  # Worker - BullMQ Background Processor
  # ---------------------------------------------------------------------------
  worker:
    image: ${DOCKER_REGISTRY:-your-registry}/ai-career-api:${IMAGE_TAG:-latest}
    container_name: ai-career-worker
    restart: unless-stopped
    networks:
      - ai-career
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobspy:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_career_platform}?schema=public&pool_timeout=60&connection_limit=10
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Auth (needed for token generation)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      
      # URLs
      WEB_URL: ${WEB_URL}
      
      # Queue
      QUEUE_PREFIX: ${QUEUE_PREFIX:-aicareer}
      ENABLE_SCHEDULER: "true"
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-2}
      NOTIFICATIONS_CONCURRENCY: ${NOTIFICATIONS_CONCURRENCY:-5}
      
      # JobSpy
      JOBSPY_SERVICE_URL: http://jobspy:8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN}
      JOBSPY_TIMEOUT_MS: ${JOBSPY_TIMEOUT_MS:-200000}
      
      # Worker Settings
      JOB_STALE_DAYS: ${JOB_STALE_DAYS:-14}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      
      # AI
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      
      # Cron Schedules
      CRON_DAILY_DIGEST: ${CRON_DAILY_DIGEST:-0 8 * * *}
      CRON_WEEKLY_DIGEST: ${CRON_WEEKLY_DIGEST:-0 8 * * 1}
      CRON_EXPIRE_JOBS: ${CRON_EXPIRE_JOBS:-0 2 * * *}
      CRON_DAILY_STATS: ${CRON_DAILY_STATS:-0 1 * * *}
      CRON_APPLICATION_REMINDERS: ${CRON_APPLICATION_REMINDERS:-0 9 * * *}
      CRON_PRUNE_LOGS: ${CRON_PRUNE_LOGS:-0 3 * * 0}
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'node.*worker.js' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "com.ai-career.service=worker"
      - "com.ai-career.version=${IMAGE_TAG:-latest}"

  # ---------------------------------------------------------------------------
  # Web - Next.js Frontend
  # ---------------------------------------------------------------------------
  web:
    image: ${DOCKER_REGISTRY:-your-registry}/ai-career-web:${IMAGE_TAG:-latest}
    container_name: ai-career-web
    restart: unless-stopped
    networks:
      - ai-career
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Note: NEXT_PUBLIC_* variables must be set at BUILD time
      # These are included here for documentation purposes only
      # They are baked into the image during build
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    # If you need direct access for debugging, uncomment:
    # ports:
    #   - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "com.ai-career.service=web"
      - "com.ai-career.version=${IMAGE_TAG:-latest}"
