name: ai-career-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_career_platform
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-career-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  jobspy:
    build:
      context: ./services/jobspy
    container_name: ai-career-jobspy
    restart: unless-stopped
    expose:
      - '8000'
    environment:
      JOBSPY_HOST: 0.0.0.0
      JOBSPY_PORT: 8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN:?Set JOBSPY_API_TOKEN in .env}
      JOBSPY_PROXIES: ${JOBSPY_PROXIES:-}
      JOBSPY_DEFAULT_RESULTS_WANTED: ${JOBSPY_DEFAULT_RESULTS_WANTED:-25}
      JOBSPY_MAX_RESULTS_WANTED: ${JOBSPY_MAX_RESULTS_WANTED:-100}
      JOBSPY_MAX_CONCURRENCY: ${JOBSPY_MAX_CONCURRENCY:-2}
      JOBSPY_REQUEST_TIMEOUT_SECONDS: ${JOBSPY_REQUEST_TIMEOUT_SECONDS:-180}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/krishanchamod2004-hub/ai-career-platform-api:latest
    container_name: ai-career-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobspy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_career_platform?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      QUEUE_PREFIX: aicareer
      RUN_WORKERS_IN_API: 'false'
      ENABLE_SCHEDULER: 'false'
      JOBSPY_SERVICE_URL: http://jobspy:8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN:?Set JOBSPY_API_TOKEN in .env}
      JOBSPY_TIMEOUT_MS: ${JOBSPY_TIMEOUT_MS:-200000}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      LEMON_SQUEEZY_VARIANT_ID_PRO: ${LEMON_SQUEEZY_VARIANT_ID_PRO:-}
      LEMON_SQUEEZY_VARIANT_ID_PREMIUM: ${LEMON_SQUEEZY_VARIANT_ID_PREMIUM:-}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/krishanchamod2004-hub/ai-career-platform-worker:latest
    container_name: ai-career-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobspy:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_career_platform?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      QUEUE_PREFIX: aicareer
      ENABLE_SCHEDULER: 'true'
      SCRAPER_CONCURRENCY: 2
      NOTIFICATIONS_CONCURRENCY: 5
      JOB_STALE_DAYS: 14
      LOG_RETENTION_DAYS: 30
      JOBSPY_SERVICE_URL: http://jobspy:8000
      JOBSPY_API_TOKEN: ${JOBSPY_API_TOKEN:?Set JOBSPY_API_TOKEN in .env}
      JOBSPY_TIMEOUT_MS: ${JOBSPY_TIMEOUT_MS:-200000}
    entrypoint: ['node', 'dist/worker.js']

  web:
    image: ghcr.io/krishanchamod2004-hub/ai-career-platform-web:latest
    container_name: ai-career-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
