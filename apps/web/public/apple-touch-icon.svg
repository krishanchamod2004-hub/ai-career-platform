<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  
  <!-- AI Career icon -->
  <g transform="translate(90, 90)">
    <!-- Circuit decoration -->
    <path d="M -30 -20 L -25 -20 L -25 -25 M -25 -20 L -20 -20" 
          stroke="#c7d2fe" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M 20 -20 L 25 -20 L 25 -25 M 25 -20 L 30 -20" 
          stroke="#c7d2fe" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M -30 20 L -25 20 L -25 25 M -25 20 L -20 20" 
          stroke="#c7d2fe" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M 20 20 L 25 20 L 25 25 M 25 20 L 30 20" 
          stroke="#c7d2fe" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
    
    <!-- Central briefcase -->
    <rect x="-28" y="-20" width="56" height="40" rx="5" fill="url(#iconGrad)" />
    
    <!-- Handle -->
    <path d="M -12 -20 L -12 -28 Q -12 -32 -8 -32 L 8 -32 Q 12 -32 12 -28 L 12 -20" 
          stroke="#c7d2fe" stroke-width="3.5" fill="none" stroke-linecap="round" />
    
    <!-- Lock detail -->
    <rect x="-4" y="-4" width="8" height="12" rx="2" fill="#0f172a" />
    <circle cx="0" cy="2" r="2.5" fill="#c7d2fe" />
    
    <!-- AI sparkle -->
    <circle cx="32" cy="-32" r="3.5" fill="#818cf8" opacity="0.8" />
    <path d="M 32 -38 L 32 -26 M 26 -32 L 38 -32" stroke="#818cf8" stroke-width="2" opacity="0.8" stroke-linecap="round" />
  </g>
</svg>
