<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  
  <!-- AI Brain icon with briefcase concept -->
  <g transform="translate(256, 256)">
    <!-- Circuit paths (AI concept) -->
    <path d="M -80 -40 L -60 -40 L -60 -60 M -60 -40 L -40 -40 M 40 -40 L 60 -40 L 60 -60 M 60 -40 L 80 -40" 
          stroke="#c7d2fe" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M -80 40 L -60 40 L -60 60 M -60 40 L -40 40 M 40 40 L 60 40 L 60 60 M 60 40 L 80 40" 
          stroke="#c7d2fe" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round" />
    
    <!-- Central briefcase/career icon -->
    <rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#iconGrad)" />
    
    <!-- Handle -->
    <path d="M -30 -50 L -30 -70 Q -30 -80 -20 -80 L 20 -80 Q 30 -80 30 -70 L 30 -50" 
          stroke="#c7d2fe" stroke-width="8" fill="none" stroke-linecap="round" />
    
    <!-- Lock/clasp -->
    <rect x="-10" y="-10" width="20" height="30" rx="4" fill="#0f172a" />
    <circle cx="0" cy="5" r="5" fill="#c7d2fe" />
    
    <!-- AI sparkle accent top-right -->
    <circle cx="85" cy="-85" r="8" fill="#818cf8" opacity="0.8" />
    <path d="M 85 -100 L 85 -70 M 70 -85 L 100 -85" stroke="#818cf8" stroke-width="4" opacity="0.8" stroke-linecap="round" />
  </g>
</svg>
