# =============================================================================
# Nginx Configuration for AI Career Platform API
# =============================================================================
# Domain: api.yourdomain.com
# Purpose: Serve NestJS API with SSL
#
# Setup Instructions:
# 1. Replace 'api.yourdomain.com' with your actual API subdomain
# 2. Copy to /etc/nginx/sites-available/ai-career-api
# 3. Create symlink: ln -s /etc/nginx/sites-available/ai-career-api /etc/nginx/sites-enabled/
# 4. Test: nginx -t
# 5. Reload: systemctl reload nginx
# =============================================================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Certificate Configuration
    # These will be generated by Certbot
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.yourdomain.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Diffie-Hellman parameter for DHE ciphersuites
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers - handled by NestJS, but can be overridden here if needed
    # add_header Access-Control-Allow-Origin "https://yourdomain.com" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    # add_header Access-Control-Allow-Credentials "true" always;

    # Logging
    access_log /var/log/nginx/ai-career-api-access.log;
    error_log /var/log/nginx/ai-career-api-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Client Upload Size (for resume uploads)
    client_max_body_size 10M;

    # Buffer settings for file uploads
    client_body_buffer_size 10M;
    client_body_timeout 60s;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Proxy Timeouts (longer for AI operations)
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Proxy to NestJS API container
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API Documentation (Swagger)
    location /api/docs {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;

        # Add basic auth for production API docs (optional)
        # auth_basic "API Documentation";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Health check endpoint - no caching
    location /api/health {
        proxy_pass http://localhost:4000;
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Webhook endpoints - increased timeouts
    location /api/billing/webhook {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        
        # Disable request buffering for webhooks
        proxy_request_buffering off;
    }

    # Rate limiting (optional - configure in nginx.conf)
    # limit_req zone=api_limit burst=20 nodelay;
    # limit_req_status 429;
}
